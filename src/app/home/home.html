<div class="container color-dark">
  <div class="col">
    <p>Un élément de liste</p>
  </div>
  <div class="col">
    <p>Ma liste d'éléments ({{ nbItems }})</p>
  </div>
</div>

<div class="container color-light">
  <div class="col">
    <button type="button" class="btn-toggle" (click)="toggleForm()">Ajouter</button>

    @if (showForm) {
      <div animate.enter="animation-ajout">
        <p class="sm">Un nouvel élément de liste</p>
        <form (submit)="ajoutItem()">
          <input type="text" class="txt" name="item" [(ngModel)]="objectifText">
          <input type="button" class="btn" [value]="btnText" (click)="ajoutItem()">
        </form>
        <p class="sm">{{ objectifText }}</p>
      </div>
    }
  </div>
  <div class="col">
    @for (element of activiteService.objectifs; track $index) {
      <p class="life-container" animate.enter="animation-ajout">{{ element }}</p>
    }
  </div>
</div>
