<div class="container color-dark">
  <div class="col">
    <p>Un élément de liste</p>
  </div>
  <div class="col">
    <p>Ma liste d'éléments ({{ nbItems }})</p>
  </div>
</div>

<div class="container color-light">
  <div class="col">
    <p class="sm">Un nouvel élément de liste</p>
    <form (submit)="ajoutItem()">
      <input type="text" class="txt" name="item" [(ngModel)]="objectifText">
      <input type="button" class="btn" [value]="btnText" (click)="ajoutItem()">
    </form>
  </div>
  <div class="col">
    @for (element of objectifs; track $index) {
      <p class="life-container">{{ element }}</p>
    }
  </div>
</div>
