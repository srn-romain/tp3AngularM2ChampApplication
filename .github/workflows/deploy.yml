name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npx ng build --base-href /tp3AngularM2ChampApplication/

      - name: Prepare SPA routing (404.html) & detect output directory
        run: |
          if [ -d "dist/tp3Angular/browser" ]; then
            cp dist/tp3Angular/browser/index.html dist/tp3Angular/browser/404.html
            echo "OUTPUT_DIR=dist/tp3Angular/browser" >> $GITHUB_ENV
          else
            cp dist/tp3Angular/index.html dist/tp3Angular/404.html
            echo "OUTPUT_DIR=dist/tp3Angular" >> $GITHUB_ENV
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
